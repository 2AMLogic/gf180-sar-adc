# Headless CI for gf180-sar-adc.
#
# SCOPE: this workflow runs every self-check in this repository that does NOT
# need ngspice or the gf180mcu PDK. Analog verification is not hermetic -- the
# PDK is a multi-gigabyte open_pdks install that no hosted GitHub runner ships --
# so the PR path is deliberately limited to the checks that are reproducible
# from a bare Ubuntu image plus CPython.
#
# The PDK-dependent half runs in .github/workflows/nightly-pdk.yml: nightly on a
# schedule, on demand, or on a PR labelled `ci:pdk`. It installs a pinned
# ngspice and gf180mcu there so it does not have to happen here.
#
# INVENTORY OF SELF-CHECKS IN THIS REPO, and where each one runs:
#
#   sim/selftest.sh stage 1  (harness unit tests, `python3 -m unittest discover
#                             -s sim/tests -t sim/tests`)
#       -> RUNS HERE, on every push and pull request. The script's own banner
#          calls stage 1 "no PDK required"; it is the headless half of the
#          acceptance test.
#
#   sim/selftest.sh stage 2  (`run_corners.py --check-env`)
#       -> NOT HERE, but covered: runs in nightly-pdk.yml, which installs the
#          exact pinned toolchain first, so the comparison against
#          sim/toolchain.json has something to compare. On a runner with neither
#          ngspice nor the PDK it would exit 3 ("tools missing"), which carries
#          no signal -- which is why it is not on this PDK-free path.
#
#   sim/selftest.sh stage 3  (end-to-end PVT sweeps over 8 experiments)
#   sim/selftest.sh stage 4  (--sabotage-corners negative control)
#       -> NOT HERE, but covered: both run in nightly-pdk.yml against a cached
#          gf180mcu install at the pinned open_pdks hash. Stage 4 is the only
#          check that can tell a live corner sweep from one silently simulating
#          typical everywhere, so a nightly failure there does not just go red:
#          it files/escalates a GitHub issue. They stay off this workflow
#          because installing the PDK is minutes, not seconds, and the PR path
#          must stay PDK-free. Run them locally too, before recording evidence
#          (docs/environment-setup.md).
#
#   sim/smoke_test/run_smoke_test.sh  (xschem -> ngspice installation smoke test)
#       -> NOT HERE (still excluded from this PDK-free workflow -- it needs
#          xschem, which has no Ubuntu package), but covered: runs in
#          nightly-pdk.yml's separate `xschem-smoke` job, which builds xschem
#          from source (cached, keyed on the `xschem_tag`/`xschem_commit` pin
#          in sim/toolchain.json) and invokes it with --no-write, so it can
#          never append machine-generated sections to
#          sim/smoke_test/smoke_test.log. Kept as its own job, not a step in
#          `selftest`, so an xschem build failure is distinguishable from a
#          corner-switching regression. Syntax-checked here too, see the
#          "shell script syntax" step.
#
#   sim/tools/pdk_mismatch_audit.py  (PDK statistical-model regression guard)
#       -> EXCLUDED from execution (reads the installed PDK's model files; exits
#          3 without one). Byte-compiled here instead, see the "python syntax"
#          step, so a syntax error cannot reach main unnoticed.
#
#   layout/drc/run_drc.py  (gf180mcu DRC bring-up: runs the proof cells and
#                           asserts their reports against layout/drc/cells/cells.json)
#       -> EXCLUDED from execution, for the same reason as the PDK-dependent
#          checks above but a different missing tool: it needs `klt`
#          (2AMLogic/klayout-tools), which has no PyPI release yet and would
#          have to be installed from git on every run. It needs no PDK and no
#          KLayout GUI, so it is a candidate to move onto this workflow once
#          klayout-tools is installable from a pinned release. Byte-compiled
#          here meanwhile, see the "python syntax" step, together with the
#          cell generators (which additionally need the pip `klayout` package).
#          Run it locally before recording layout evidence: layout/README.md.
#
#   sim/env.sh  (environment export helper, not a check)
#       -> Syntax-checked only.
#
# Nothing here installs ngspice, xschem, or the gf180mcu PDK. Keep it that way:
# if a check needs the PDK it belongs in nightly-pdk.yml, listed above with a
# reason, not on the default PR path.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: headless checks
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The harness is stdlib-only (argparse/dataclasses/json/pathlib/...),
          # so there is no dependency install step and no requirements file.
          # Verified against CPython 3.10 and 3.12; pinned rather than floating
          # so a runner-image bump cannot silently change what "green" means.
          python-version: '3.12'

      - name: Shell script syntax (bash -n)
        # Parse-only check for the shell entry points. The PDK-dependent ones
        # cannot be executed here, but a syntax error in them should still not
        # reach main.
        run: |
          status=0
          for script in sim/selftest.sh sim/env.sh sim/smoke_test/run_smoke_test.sh; do
            if bash -n "$script"; then
              echo "ok: $script"
            else
              echo "::error file=$script::bash syntax error"
              status=1
            fi
          done
          exit "$status"

      - name: Python syntax (compileall)
        # Covers the modules the unit tests do not import, notably
        # sim/tools/pdk_mismatch_audit.py, which needs an installed PDK to run,
        # and all of layout/, whose DRC runner and cell generators need `klt`
        # and the pip `klayout` package respectively -- neither installed here.
        run: python3 -m compileall -q sim layout

      - name: Harness unit tests (sim/selftest.sh stage 1)
        # Kept byte-identical to the invocation in sim/selftest.sh so local and
        # CI runs cannot diverge.
        run: python3 -m unittest discover -s sim/tests -t sim/tests
